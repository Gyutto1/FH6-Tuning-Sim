[project]
name = "fh6-tuning-sim"
version = "0.1.0"
description = "Forza Horizon 6 Data Out telemetry logger and rule-based tuning analyzer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "PySide6>=6.8",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
